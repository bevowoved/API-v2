app = 'mauria-api'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'
  compression = 'zstd'
  compression_level = 3

[env]
  PORT = '8080'
  AURION_MAX_SOCKETS = '32'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[http_service.concurrency]
  type = 'requests'
  soft_limit = 20
  hard_limit = 25

[[http_service.checks]]
  interval = '30s'
  timeout = '5s'
  grace_period = '20s'
  method = 'get'
  path = '/healthz'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
