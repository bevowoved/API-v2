name: Fly Deploy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    name: Typecheck and test (Node ${{ matrix.node }})
    if: github.repository == 'MauriaApp/API-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  image:
    name: Build the image once, then test (Node 26, coverage) and gate it
    if: github.repository == 'MauriaApp/API-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: debug
          outputs: type=local,dest=artifacts
          cache-from: type=gha,scope=image
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: mauria-api:budget
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image
          cache-to: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'type=gha,scope=image,mode=max,ignore-error=true' || '' }}
      - run: IMAGE=mauria-api:budget node scripts/lock.mjs build coverage
      - run: docker run -d --name api -p 8080:8080 mauria-api:budget && curl -fsS --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/healthz && curl -fsS http://127.0.0.1:8080/json >/dev/null && docker rm -f api
      - run: sha256sum artifacts/debug/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-debug-${{ github.sha }}
          path: artifacts/debug/
      - if: github.repository == 'MauriaApp/API-v2' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "$FLY_API_TOKEN" | docker login registry.fly.io -u x --password-stdin
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - if: github.repository == 'MauriaApp/API-v2' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          provenance: false
          sbom: false
          outputs: type=image,name=registry.fly.io/mauria-api:${{ github.sha }},push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true
          cache-from: type=gha,scope=image
      - if: github.repository == 'MauriaApp/API-v2' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          tested=$(docker image inspect mauria-api:budget --format '{{json .RootFS.Layers}}' | jq -c .)
          pushed=$(docker buildx imagetools inspect registry.fly.io/mauria-api:${{ github.sha }} --format '{{json .Image.RootFS.DiffIDs}}' | jq -c .)
          echo "tested: $tested"; echo "pushed: $pushed"
          [ "$tested" = "$pushed" ]
  deploy:
    name: Deploy app
    needs: [typecheck, image]
    if: github.repository == 'MauriaApp/API-v2' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - run: flyctl secrets set SENTRY_RELEASE=${{ github.sha }} --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --image registry.fly.io/mauria-api:${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
